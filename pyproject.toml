[project]
name = "feetgp"
version = "0.1.0"
description = "Group-lasso variable selection over foot markers, GP and linear"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "einops>=0.8.2",
    "equinox>=0.13.8",
    "ipykernel>=7.2.0",
    "jax[cuda]>=0.9.0.1",
    "jaxtyping>=0.3.7",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "plotly>=6.7.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
    "openpyxl>=3.1.5",
    "joblib>=1.5.3",
    "jaxvlse>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feetgp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "scipy>=1.17.0",
]
